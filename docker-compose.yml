services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: appraisal
      POSTGRES_USER: appraisal
      POSTGRES_PASSWORD: local-appraisal-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appraisal -d appraisal"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: local-docker-secret-change-before-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080
      POSTGRES_DB: appraisal
      POSTGRES_USER: appraisal
      POSTGRES_PASSWORD: local-appraisal-password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_COOKIE_SECURE: "false"
      FRONTEND_URL: http://localhost:8080
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      DEFAULT_FROM_EMAIL: noreply@appraisal.local
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_files:/app/staticfiles

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    volumes:
      - static_files:/srv/static:ro

volumes:
  postgres_data:
  static_files:

